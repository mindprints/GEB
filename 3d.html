<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEB in 3D — four rooms</title>
<style>
  :root { --ink:#14110f; --paper:#e8dfc8; --gold:#c9a24a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#14100c; color:var(--paper); font-family: Georgia, "Times New Roman", serif; overflow:hidden; }
  canvas#gl { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; }
  .hud { position:fixed; left:0; right:0; top:0; padding:10px 14px; display:flex; justify-content:space-between; gap:16px; pointer-events:none; text-shadow:0 1px 3px #000; font-size:clamp(12px,1.5vw,16px); z-index:2; }
  .hud b { color:var(--gold); letter-spacing:.08em; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  #tabs { position:fixed; left:50%; transform:translateX(-50%); top:38px; display:flex; gap:6px; z-index:3; flex-wrap:wrap; justify-content:center; }
  #tabs button { opacity:.75; font-size:clamp(10px,1.2vw,13px); padding:3px 10px; }
  #tabs button.on { opacity:1; background:var(--gold); color:var(--ink); }
  #say { position:fixed; left:50%; transform:translateX(-50%); bottom:14px; width:min(86%,720px); padding:9px 14px; background:rgba(20,17,15,.9); border:1px solid var(--gold); font-style:italic; font-size:clamp(12px,1.5vw,15px); display:none; z-index:4; }
  #say b { font-style:normal; color:var(--gold); }
  #keys { position:fixed; right:12px; bottom:12px; font-size:12px; opacity:.7; text-align:right; text-shadow:0 1px 2px #000; pointer-events:none; max-width:46vw; }
  #jump { position:fixed; right:14px; top:70px; z-index:3; }
  button, select { font:inherit; cursor:pointer; background:var(--ink); color:var(--paper); border:1px solid var(--gold); padding:5px 12px; margin:2px 4px 2px 0; }
  button:hover { filter:brightness(1.25); }
  button.on { background:var(--gold); color:var(--ink); }
  button:disabled { opacity:.35; cursor:default; }
  #panel { position:fixed; left:12px; top:70px; width:316px; max-height:calc(100vh - 90px); overflow:auto; padding:12px 14px; background:rgba(20,17,15,.88); border:1px solid var(--gold); display:none; z-index:3; font-size:14px; line-height:1.4; }
  #panel h2 { margin:.2em 0 .25em; font-size:1.05em; color:var(--gold); letter-spacing:.04em; }
  .box { margin:6px 0; padding:6px 8px; border:1px dashed #6b5a2a; min-height:2.6em; }
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.72); z-index:6; padding:12px; }
  .overlay > div { max-width:540px; padding:22px 26px; border:1px solid var(--gold); background:var(--ink); line-height:1.45; font-size:clamp(13px,1.6vw,16px); }
  #win { display:none; } #intro { cursor:pointer; }
  a { color:var(--gold); }
  #sr { position:absolute; left:-9999px; }
  @media (max-width: 820px) {
    #panel { left:0; right:0; top:auto; bottom:0; width:auto; max-height:44vh; border-width:1px 0 0 0; }
    #jump { top:96px; }
  }
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="3D view of the puzzle chamber"></canvas>
<div class="hud">
  <div><b id="hudroom">ROOM 1</b> &nbsp;<span id="hudname"></span> &nbsp;·&nbsp; <a href="index.html" style="pointer-events:auto">2D version</a></div>
  <div id="hudright"></div>
</div>
<div id="tabs"></div>
<button id="jump" title="Jump out of the system (J)">⤴ Jump out of the system</button>
<div id="say"></div>
<div id="keys"></div>
<div id="sr" role="status" aria-live="polite"></div>
<div id="panel"></div>

<div id="intro" class="overlay"><div id="introbody"></div></div>
<div id="win" class="overlay"><div>
  <h2 style="color:var(--gold);margin-top:0">The gate opens</h2>
  <p id="wintext"></p>
  <button id="again" class="on">Play again</button> <button id="nextroom" class="on" style="display:none">Next room →</button>
</div></div>

<script src="vendor/three.min.js"></script>
<script>
'use strict';
const clamp01 = u => Math.max(0, Math.min(1, u)), ease = u => u * u * (3 - 2 * u), lerp = (a, b, k) => a + (b - a) * k;
const $ = id => document.getElementById(id);

// ================================================================ audio
let AC = null;
function audio() { if (!AC) try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} return AC; }
function tone(f, t0, dur, type = 'triangle', vol = .07) {
  const ac = audio(); if (!ac) return; const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
  const t = ac.currentTime + t0; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.start(t); o.stop(t + dur + .05);
}
const buzz = () => tone(90, 0, .25, 'sawtooth', .06);
const NOTE = { M: 146.83, I: 329.63, U: 440, '-': 261.63, p: 392, q: 523.25 };
const playString = s => [...s].slice(0, 10).forEach((c, i) => tone(NOTE[c] || 200, i * .1, .32));

// ================================================================ three.js basics
const cvs = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas: cvs, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color('#1a1410');
const camera = new THREE.PerspectiveCamera(50, 1, .1, 600);
const TAN = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
scene.add(new THREE.HemisphereLight('#fff1d6', '#3a2a1c', .8));
const lamp = new THREE.PointLight('#ffe2b0', 1.5, 70, 1.0); lamp.position.set(0, 5.4, 1.5); scene.add(lamp);
const sun = new THREE.DirectionalLight('#fff7e8', .55); sun.position.set(8, 30, 14); scene.add(sun);

function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }
const std = o => new THREE.MeshStandardMaterial(Object.assign({ roughness: .8, metalness: 0 }, o));
function box(parent, w, h, d, x, y, z, m) { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); parent.add(o); return o; }
function lyingLabel(text, w, h, color = '#2a241c', px = 56, parent = pageG, font = 'bold PX Georgia') {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ transparent: true, map: canvasTex(512, Math.max(32, Math.round(512 * h / w)), (g, cw, ch) => { g.fillStyle = color; g.font = font.replace('PX', px + 'px'); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, cw / 2, ch / 2); }) }));
  m.rotation.x = -Math.PI / 2; parent.add(m); return m;
}

// ---------------------------------------------------------------- the world: desk > book > page
const desk = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), std({ color: '#3a2a1c', roughness: .9 })); desk.rotation.x = -Math.PI / 2; desk.position.y = -1.3; scene.add(desk);
box(scene, 86, 1.2, 62, 6, -.7, 3, std({ color: '#5a3320', roughness: .7 }));
box(scene, 82, .5, 58, 6, -.3, 3, std({ color: '#d8ccb0' }));
const page = new THREE.Mesh(new THREE.PlaneGeometry(80, 56), std({ color: '#fff', map: canvasTex(1024, 720, (g, w, h) => {
  g.fillStyle = '#efe6cf'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2400; i++) { g.fillStyle = `rgba(120,100,60,${Math.random() * .05})`; g.fillRect(Math.random() * w, Math.random() * h, 2 + Math.random() * 14, 1); }
  g.strokeStyle = 'rgba(120,100,60,.12)'; for (let y = 40; y < h; y += 28) { g.beginPath(); g.moveTo(40, y); g.lineTo(w - 40, y); g.stroke(); } }) }));
page.rotation.x = -Math.PI / 2; page.position.set(6, -.02, 3); scene.add(page);
const inkwell = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.3, 1.6, 20), std({ color: '#111', roughness: .3 })); inkwell.position.set(-26, .8, 18); scene.add(inkwell);
const quill = new THREE.Mesh(new THREE.ConeGeometry(.25, 11, 8), std({ color: '#f0e8d8' })); quill.position.set(-23, 3.2, 18); quill.rotation.set(0, 0, 1.0); scene.add(quill);
const pageG = new THREE.Group(); scene.add(pageG);        // things that exist only on the page (lens, plans, text)
const chamber = new THREE.Group(); scene.add(chamber);    // the room: folds flat when you jump out

// ---------------------------------------------------------------- the stage (shared by all rooms)
const TABLE_TOP = 1.35, WALL_H = 6.5, HALF_W = 8.2;
const wallM = std({ color: '#6b6355' }), stoneM = std({ color: '#b3aa94' });
let frontWall = null;
function buildStage(tableDepth = 3.4, tableZ = 0) {
  chamber.clear();
  box(chamber, HALF_W * 2 + .4, .2, 14.6, 0, -.1, 1, stoneM);
  box(chamber, HALF_W * 2 + .4, WALL_H, .4, 0, WALL_H / 2, -6.2, wallM);
  box(chamber, .4, WALL_H, 14.6, -HALF_W - .2, WALL_H / 2, 1, wallM); box(chamber, .4, WALL_H, 14.6, HALF_W + .2, WALL_H / 2, 1, wallM);
  frontWall = box(chamber, HALF_W * 2 + .4, WALL_H, .4, 0, WALL_H / 2, 8.4, wallM); frontWall.visible = false;
  box(chamber, 15.6, 1.2, tableDepth, 0, .6, tableZ, std({ color: '#7a6a52' }));
  box(chamber, 15.8, .15, tableDepth + .2, 0, 1.275, tableZ, std({ color: '#8d7a5c' }));
  const gl = new THREE.PointLight('#ffd9a0', .9, 16, 1); gl.position.set(0, 4.5, -3); chamber.add(gl);
}
function makeGate(cx, w = 4.4) {                                   // a door in the back wall; returns {door, glow}
  const doorM = std({ color: '#7a5a1e', roughness: .5, metalness: .3 }), hw = w / 2;
  box(chamber, w, .5, .6, cx, 4.5, -5.8, wallM); box(chamber, .5, 4.5, .6, cx - hw, 2.25, -5.8, wallM); box(chamber, .5, 4.5, .6, cx + hw, 2.25, -5.8, wallM);
  const door = box(chamber, w - .5, 4.2, .35, cx, 2.15, -5.85, doorM);
  for (let i = -1; i <= 1; i++) box(chamber, .12, 4.2, .1, cx + i * (w - .5) / 3, 2.15, -5.64, std({ color: '#b08a30', metalness: .5, roughness: .4 }));
  const glow = new THREE.PointLight('#fff2c0', 0, 20); glow.position.set(cx, 2.5, -4.5); chamber.add(glow);
  return { door, glow, open() { tween(1.6, u => { door.position.y = 2.15 - 4.4 * u; glow.intensity = 3 * u; }); } };   // the door sinks into the floor
}

// tiles ---------------------------------------------------------------
const STYLE = { M: ['#46658f', '#f2ecd8'], I: ['#e6dbbd', '#2a2418'], U: ['#c9a24a', '#2a2418'], '-': ['#d9cfb2', '#2a2418'], p: ['#5f8f5f', '#f2ecd8'], q: ['#8f5f86', '#f2ecd8'],
  C: ['#c0605a', '#fff'], D: ['#d08a4a', '#fff'], E: ['#c9b24a', '#2a2418'], F: ['#5a9a6a', '#fff'], G: ['#4a7ac0', '#fff'] };
const GLYPH = { '-': '—' }, matCache = {};
function tileMats(ch) {
  if (matCache[ch]) return matCache[ch]; const [bg, ink] = STYLE[ch];
  const tex = canvasTex(128, 128, (g, w, h) => { g.fillStyle = bg; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 6; g.strokeRect(3, 3, w - 6, h - 6);
    g.fillStyle = ink; g.font = 'bold 92px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(GLYPH[ch] || ch, w / 2, h / 2 + 6); });
  const side = std({ color: bg, roughness: .6 }), face = std({ map: tex, roughness: .55 });
  return matCache[ch] = [side, side, face, side, face, side];
}
const unitBox = new THREE.BoxGeometry(1, 1, 1), haloGeo = new THREE.BoxGeometry(1.14, 1.14, 1.14);
function makeTile(ch, parent = chamber, halo = true) {
  const m = new THREE.Mesh(unitBox, tileMats(ch)); m.userData = { ch, tile: true };
  if (halo) { const g = new THREE.Mesh(haloGeo, new THREE.MeshBasicMaterial({ color: '#ffd35a', transparent: true, opacity: .55, depthWrite: false })); g.visible = false; m.add(g); m.userData.halo = g; }
  parent.add(m); return m;
}
const widthOf = ch => ch === '-' ? .55 : 1;
// a row of tiles on the table. o: { cx, z, maxW, unit, yOf(i, ch) }
function makeRow(o) {
  const row = { tiles: [], str: '', o };
  row.layout = str => {
    const f = [...str].map(widthOf), sum = f.reduce((a, b) => a + b, 0) || 1, u = Math.min(o.unit || 1.15, o.maxW / sum), out = []; let cum = 0;
    [...str].forEach((ch, i) => { const sx = f[i] * u * .86, sy = u * .86, x = o.cx - sum * u / 2 + (cum + f[i] / 2) * u; cum += f[i];
      out.push({ x, y: TABLE_TOP + sy / 2 + (o.yOf ? o.yOf(i, ch) : 0), z: o.z, sx, sy, sz: u * .6 }); });
    return out;
  };
  row.build = str => { row.tiles.forEach(t => chamber.remove(t)); row.tiles = []; const L = row.layout(str);
    [...str].forEach((ch, i) => { const t = makeTile(ch); t.position.set(L[i].x, L[i].y, L[i].z); t.scale.set(L[i].sx, L[i].sy, L[i].sz); row.tiles.push(t); }); row.str = str; };
  return row;
}
// morph a row into a new string. keep[j] = new index of old tile j (or -1 to remove); spawns = [{ni, from?, delay?}]
function morphRow(row, neu, keep, spawns, o = {}) {
  const L = row.layout(neu), old = row.tiles, nt = new Array(neu.length).fill(null);
  keep.forEach((ni, j) => { if (ni >= 0) nt[ni] = old[j]; });
  const vs = old.filter((t, j) => keep[j] < 0).map(t => ({ t, p0: t.position.clone(), s0: t.scale.clone() }));
  const sp = spawns.map(s => { const t = makeTile(neu[s.ni]); t.position.copy(s.from ? s.from.clone() : new THREE.Vector3(L[s.ni].x, L[s.ni].y + 2.5, L[s.ni].z)); t.scale.setScalar(.001); nt[s.ni] = t; return Object.assign({ t }, s); });
  const st = nt.map(t => ({ p: t.position.clone(), s: t.scale.clone() }));
  S.busy++; row.str = neu;
  tween(o.dur || .7, u => {
    nt.forEach((t, ni) => { const s = sp.find(q => q.t === t); let e = u; if (s) e = ease(s.delay ? clamp01((u - s.delay) / (1 - s.delay)) : u);
      t.position.set(lerp(st[ni].p.x, L[ni].x, e), lerp(st[ni].p.y, L[ni].y, e), lerp(st[ni].p.z, L[ni].z, e));
      t.scale.set(lerp(st[ni].s.x, L[ni].sx, e), lerp(st[ni].s.y, L[ni].sy, e), lerp(st[ni].s.z, L[ni].sz, e)); });
    vs.forEach(v => { const tgt = o.vanishTo !== undefined ? new THREE.Vector3(L[o.vanishTo].x, L[o.vanishTo].y, L[o.vanishTo].z) : v.p0, k = clamp01(u * 1.5);
      v.t.position.lerpVectors(v.p0, tgt, k); v.t.position.y += .5 * Math.sin(u * Math.PI); const sc = Math.max(.001, 1 - k); v.t.scale.set(v.s0.x * sc, v.s0.y * sc, v.s0.z * sc); });
  }, () => { vs.forEach(v => chamber.remove(v.t)); row.tiles = nt; S.busy--; o.done && o.done(); flush(); });
}
function signRow(str, cx, y, z, unit, yOf) {                       // static tiles, e.g. the tune or string on a door
  const row = makeRow({ cx, z, maxW: 99, unit, yOf }), L = row.layout(str);
  [...str].forEach((ch, i) => { const t = makeTile(ch, chamber, false); t.position.set(L[i].x, y + (yOf ? yOf(i, ch) : 0), z); t.scale.set(L[i].sx, L[i].sy, L[i].sz * .5); });
}
// buttons ---------------------------------------------------------------
function makeButton(label, sub, x, z, color = '#2c4a3a', w = 1.9, onClick) {
  const tex = canvasTex(256, 256, (g, cw, ch) => { g.fillStyle = color; g.fillRect(0, 0, cw, ch); g.strokeStyle = '#c9a24a'; g.lineWidth = 10; g.strokeRect(8, 8, cw - 16, ch - 16);
    g.fillStyle = '#f2ecd8'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `bold ${label.length > 2 ? 84 : 110}px Georgia`; g.fillText(label, cw / 2, ch * (sub ? .4 : .5)); if (sub) { g.font = '32px ui-monospace, Menlo, monospace'; g.fillText(sub, cw / 2, ch * .76); } });
  const gold = std({ color: '#c9a24a' }), m = new THREE.Mesh(new THREE.BoxGeometry(w, .35, w), [gold, gold, std({ map: tex }), gold, gold, gold]);
  m.position.set(x, TABLE_TOP + .17, z); m.userData = { onClick, button: true, y0: TABLE_TOP + .17 }; chamber.add(m); return m;
}
function press(b) { tween(.18, u => { b.position.y = b.userData.y0 - .12 * Math.sin(u * Math.PI); }); }
function shake(m) { const x0 = m.position.x; tween(.25, u => { m.position.x = x0 + Math.sin(u * 24) * .12 * (1 - u); }, () => { m.position.x = x0; }); }

// ================================================================ state, tweens, speech
const S = { queue: [], room: null, layer: 0, anim: null, busy: 0, t: 0, won: false, proved: false, axiom: 'MI', hist: [], moves: 0, hover: null, click: [] };
const R = {};                                                         // per-room scratch state
const tweens = [];
function tween(dur, fn, done) { tweens.push({ t: 0, dur, fn, done }); }
function enqueue(fn) { if (S.queue.length < 8) S.queue.push(fn); flush(); }
function flush() { while (S.queue.length && !S.busy && !S.anim) S.queue.shift()(); }
function runTweens(dt) { for (let i = tweens.length - 1; i >= 0; i--) { const T = tweens[i]; T.t = Math.min(T.dur, T.t + dt); T.fn(ease(T.t / T.dur)); if (T.t >= T.dur) { tweens.splice(i, 1); T.done && T.done(); } } }
let sayT = 0;
function say(who, text, ms = 6500) { const e = $('say'); e.innerHTML = `<b>${who}:</b> ${text}`; e.style.display = 'block'; clearTimeout(sayT); sayT = setTimeout(() => e.style.display = 'none', ms); }
function hint() { const h = S.room.hints.find(h => h[0] === S.moves); if (h) say(h[1], h[2], 7500); }
function announce(t) { $('sr').textContent = t; }

// ================================================================ camera: inside the room, and above the page
const room = () => S.room;
function inCam() {
  const c = S.room.cam, a = innerWidth / innerHeight, d = Math.max(c.minDist || 11.5, c.halfW / (TAN * a)), pitch = THREE.MathUtils.degToRad(c.pitch);
  const tg = new THREE.Vector3(...c.target); return { p: new THREE.Vector3(tg.x, tg.y + d * Math.sin(pitch), tg.z + d * Math.cos(pitch)), l: tg };
}
function panelSize() { const wide = innerWidth > 820; return wide ? { x: 340, y: 0 } : { x: 0, y: innerHeight * .44 }; }
function outCam() {
  const ps = panelSize(), vw = innerWidth - ps.x, vh = innerHeight - ps.y, a = vw / vh, c = S.room.page;
  const d = Math.max(c.minDist || 25, c.halfW / (TAN * a), c.halfD / (TAN * .8)), pitch = THREE.MathUtils.degToRad(c.pitch || 54), tg = new THREE.Vector3(c.cx, 0, c.cz);
  return { p: new THREE.Vector3(tg.x, d * Math.sin(pitch), tg.z + d * Math.cos(pitch)), l: tg };
}
function placeCamera(t) {                                              // t: 0 = inside the room, 1 = above the page
  const A = inCam(), B = outCam(), e = ease(t);
  camera.position.set(lerp(A.p.x, B.p.x, e), lerp(A.p.y, B.p.y, ease(clamp01(t / .7))), lerp(A.p.z, B.p.z, ease(clamp01((t - .25) / .75))));
  camera.lookAt(lerp(A.l.x, B.l.x, e), lerp(A.l.y, B.l.y, e), lerp(A.l.z, B.l.z, e));
  chamber.scale.y = 1 - .96 * ease(clamp01((t - .2) / .5));             // the room folds flat into a plan
  if (frontWall) frontWall.visible = t > .45;
  pageG.visible = t > .5; inkwell.visible = quill.visible = t > .45;
  const ps = panelSize(), o = ease(clamp01((t - .4) / .6));
  if (ps.x || ps.y) camera.setViewOffset(innerWidth, innerHeight, -ps.x / 2 * o, ps.y / 2 * o, innerWidth, innerHeight); else camera.clearViewOffset();
}

// ================================================================ jumping out and diving back in
function jumpOut() {
  if (S.layer !== 0 || S.anim || S.won || S.busy || R.walking) return; if (R.clearPick) R.clearPick(); $('say').style.display = 'none';
  S.anim = 'out'; $('jump').style.display = 'none'; tone(60, 0, 1.4, 'sine', .15); tone(90, .25, 1.2, 'sine', .1);
  pageG.clear(); S.room.buildPage(); drawPageText();
  tween(3.2, u => { S.t = u; placeCamera(u); }, () => { S.anim = null; S.layer = 1; S.t = 1; $('panel').style.display = 'block'; S.room.refreshPanel(); });
}
function diveIn() {
  if (S.layer !== 1 || S.anim) return; S.anim = 'in'; $('panel').style.display = 'none';
  if (S.room.onDive) S.room.onDive(); tone(NOTE.M * 2, 0, .4);
  tween(3.0, u => { S.t = 1 - u; placeCamera(S.t); }, () => { S.anim = null; S.layer = 0; S.t = 0; placeCamera(0); $('jump').style.display = ''; pageG.clear(); if (S.room.afterDive) S.room.afterDive(); });
}
let pageTextMesh = null;
function drawPageText() {
  const lines = S.room.pageLines(); if (pageTextMesh) pageG.remove(pageTextMesh);

          else if (isExit(x, y)) { c.fillStyle = '#2a6b2a'; c.fillRect(ox + 2, oy + 2, px - 4, px - 4); c.fillStyle = '#fff'; c.font = 'bold 22px Georgia'; c.textAlign = 'center'; c.fillText('E', ox + px / 2, oy + px / 2 + 8); } }

        if (R.g === g) { c.fillStyle = '#c9503a'; c.beginPath(); c.arc(10 + (14 - R.cell[1] + .5) * px, 40 + (R.cell[0] - 1 + .5) * px, 9, 0, 7); c.fill(); } });
      const m = new THREE.Mesh(new THREE.PlaneGeometry(14.4, 8.4 + 1.4), new THREE.MeshBasicMaterial({ map: tex, transparent: true })); m.rotation.x = -Math.PI / 2; m.position.set(18.5, .03, g * 11 - 4); pageG.add(m);
    });
  },
  panel: `<h2>The Tortoise's desk</h2><div>Inside, you only ever see one world at a time. Here are both plans on one page. Gold <b>⇅</b> squares exist in both worlds; <b>E</b> is the exit; the red dot is your pawn.</div>
    <div id="eslens" class="box" aria-live="polite"></div><div>A wall in one plan is open ground in the other, so any blocked passage can be crossed by flipping at the right place.</div>`,
  initPanel() {}, refreshPanel() { $('eslens').innerHTML = `The pawn is in the <b>${R.g ? 'ceiling' : 'floor'}</b> world.`; },
  onDive() { /* the pawn stays where it is */ },
  winText: () => `You crossed a building that cannot exist by treating its two worlds as two maps and hopping between them. From inside, each world was a maze with no way out. From above, the two plans together had one. That is the same move as the other rooms: the trick that solves the problem lives one level up.`,
};

// ================================================================ rooms, loading, interface
const ROOMS = { miu: MIU, pq: PQ, bach: BACH, escher: ESC };
function refreshHud() { $('hudright').innerHTML = S.room.hud(); }
function loadRoom(id, withIntro = true) {
  tweens.length = 0; S.room = ROOMS[id]; Object.assign(S, { queue: [], layer: 0, anim: null, busy: 0, t: 0, won: false, proved: false, axiom: 'MI', hist: [], moves: 0 });
  Object.keys(R).forEach(k => delete R[k]); pageG.clear(); pageTextMesh = null; $('win').style.display = 'none'; $('panel').style.display = 'none'; $('jump').style.display = '';
  $('panel').innerHTML = S.room.panel + '<div style="margin-top:10px"><button id="dive"><b>Dive back in ⤵</b></button></div>'; $('dive').onclick = diveIn; S.room.initPanel(); S.room.build();
  $('hudroom').textContent = 'ROOM ' + (Object.keys(ROOMS).indexOf(id) + 1); $('hudname').textContent = S.room.name; $('keys').textContent = S.room.keys;
  document.querySelectorAll('#tabs button').forEach(b => b.className = b.dataset.id === id ? 'on' : '');
  placeCamera(0); refreshHud(); if (withIntro) { $('introbody').innerHTML = S.room.intro; $('intro').style.display = 'flex'; }
  say(S.room.welcome[0], S.room.welcome[1], 7000); history.replaceState(null, '', id === 'miu' ? location.pathname + location.search : '#' + id);
}
Object.entries(ROOMS).forEach(([id, r]) => { const b = document.createElement('button'); b.textContent = r.tab; b.dataset.id = id; b.onclick = () => { if (!S.anim) loadRoom(id); }; $('tabs').appendChild(b); });
$('jump').onclick = jumpOut;
$('again').onclick = () => loadRoom(S.room.id, false); $('nextroom').onclick = () => loadRoom(S.room.next);

// ---------------------------------------------------------------- input
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let mx = 0;
function pickAt(ev) {
  const r = cvs.getBoundingClientRect(); mouse.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(S.room.clickables(), false)[0]; return hit || null;
}
cvs.addEventListener('pointermove', ev => { mx = ev.clientX / innerWidth * 2 - 1; if (S.layer !== 0 || S.anim) { cvs.style.cursor = ''; return; } const h = pickAt(ev); cvs.style.cursor = h && (h.object.userData.onClick || h.object.userData.tile || S.room === ESC) ? 'pointer' : ''; });
cvs.addEventListener('pointerdown', ev => {
  audio(); if (S.layer !== 0 || S.anim) return; const h = pickAt(ev); if (!h) return;
  if (S.room === ESC) { S.room.onPoint(h.point); return; } const o = h.object; enqueue(() => S.room.onClick(o));
});
const introEl = $('intro');
function closeIntro() { if (introEl.style.display !== 'none') { introEl.style.display = 'none'; audio(); cvs.focus(); } }
introEl.addEventListener('click', closeIntro);
addEventListener('keydown', e => {
  if (introEl.style.display !== 'none') { closeIntro(); return; } audio(); if (e.target.tagName === 'SELECT' || e.metaKey || e.ctrlKey) return; const k = e.key.toLowerCase();
  if (k === 'j') { S.layer === 0 ? jumpOut() : diveIn(); return; }
  if (S.layer === 0 && !S.anim) { if (k.startsWith('arrow')) e.preventDefault(); if (S.room === ESC) S.room.onKey(k); else enqueue(() => S.room.onKey(k)); }
});

// ---------------------------------------------------------------- loop
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(.05, (now - last) / 1000); last = now; runTweens(dt);
  if (!S.anim) { placeCamera(S.t); if (S.layer === 0) camera.position.x += mx * .5; }
  const tt = now / 1000; if (R.row && R.row.tiles) R.row.tiles.forEach(t => { if (t.userData.halo && t.userData.halo.visible) t.userData.halo.material.opacity = .35 + .25 * Math.sin(tt * 6); });
  if (S.room.frame) S.room.frame(tt); syncStems(); renderer.render(scene, camera);
});
const startId = ROOMS[location.hash.slice(1)] ? location.hash.slice(1) : 'miu';
loadRoom(startId);
window.G3 = { S, R, ROOMS, loadRoom, jumpOut, diveIn, camera, scene, chamber, win, MIU, PQ, BACH, ESC, eWorld, ePath, ESCHER };
</script>
